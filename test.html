<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Resume Predictor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        input[type="file"] {
            margin: 15px 0;
            width: 100%;
            padding: 10px;
            background: #334155;
            color: white;
            border: none;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #2563eb;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #0f172a;
            border-radius: 8px;
        }

        .loading {
            display: none;
            margin-top: 10px;
            color: #93c5fd;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>📄 AI Resume Predictor</h1>

    <input type="file" id="fileInput" accept=".pdf" />

    <button onclick="uploadResume()">Predict Category</button>

    <div class="loading" id="loading">Processing resume...</div>

    <div class="result" id="result">
        Upload a resume to see prediction
    </div>
</div>

<script>
async function uploadResume() {
    const fileInput = document.getElementById("fileInput");
    const file = fileInput.files[0];

    const resultBox = document.getElementById("result");
    const loading = document.getElementById("loading");

    if (!file) {
        alert("Please select a PDF file!");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    loading.style.display = "block";
    resultBox.innerHTML = "";

    try {
        const response = await fetch("http://127.0.0.1:8000/predict", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        resultBox.innerHTML = `
            <h3>🎯 Result</h3>
            <p><b>Category:</b> ${data.category}</p>
            <p><b>Confidence:</b> ${data.confidence}%</p>
        `;

    } catch (error) {
        resultBox.innerHTML = "❌ Error connecting to server";
    }

    loading.style.display = "none";
}
</script>

</body>
</html>
