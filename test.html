<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Resume Ranker</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      width: 400px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    input {
      margin: 15px 0;
      width: 100%;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    .result {
      margin-top: 20px;
      text-align: left;
      font-size: 14px;
      white-space: pre-wrap;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
    }

    .loading {
      color: #facc15;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>📄 AI Resume Ranker</h1>

  <input type="file" id="fileInput" accept=".pdf" />

  <button onclick="uploadResume()">Analyze Resume</button>

  <div id="status" class="loading"></div>
  <div id="result" class="result"></div>
</div>

<script>
async function uploadResume() {
  const fileInput = document.getElementById("fileInput");
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if (!fileInput.files.length) {
    alert("Please select a PDF file");
    return;
  }

  const formData = new FormData();
  formData.append("file", fileInput.files[0]);

  status.innerText = "Uploading & Analyzing...";
  result.innerText = "";

  try {
    const response = await fetch("https://ai-resumer.buttnetworks.com/predict", {
      method: "POST",
      body: formData
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.detail || "Something went wrong");
    }

    status.innerText = "Done ✅";

    result.innerText = JSON.stringify(data.analysis, null, 2);

  } catch (error) {
    status.innerText = "Error ❌";
    result.innerText = error.message;
  }
}
</script>

</body>
</html>
